name: Compilar para Simulador iOS

on:
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Compilar para iOS Simulator
        run: |
          xcodebuild \
            -project iOS-SmartWebView.xcodeproj \
            -scheme iOS-SmartWebView \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Garantir splash dentro do aplicativo
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)

          echo "Aplicativo encontrado em: $APP_PATH"

          cp Resources/splash_njci.png "$APP_PATH/splash_njci.png"

          echo "Verificando splash:"
          ls -lh "$APP_PATH/splash_njci.png"

      - name: Preparar aplicativo do simulador
        run: |
          mkdir -p build/SimulatorApp
          cp -R build/DerivedData/Build/Products/Debug-iphonesimulator/*.app build/SimulatorApp/

      - name: Enviar aplicativo do simulador
        uses: actions/upload-artifact@v4
        with:
          name: NJCI-iOS-Simulator
          path: build/SimulatorApp/
